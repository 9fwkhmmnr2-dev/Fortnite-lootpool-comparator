<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORTNITE LOOTPOOL COMPARATOR</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0a0a0f;color:#fff;font-family:system-ui}
.card{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03)}
.card.selected{border-color:#00E5FF;box-shadow:0 0 15px rgba(0,229,255,.4)}
.badge-rec{background:linear-gradient(90deg,#FFD700,#FFA500);color:#000;font-weight:900}
</style>
</head>
<body class="p-4 max-w-7xl mx-auto">
<header class="text-center mb-6">
  <h1 class="text-3xl font-black">FORTNITE LOOTPOOL COMPARATOR</h1>
  <p class="opacity-60">Compará el lootpool actual. Elegí tus armas. Encontrá el meta.</p>
  <p class="text-xs mt-2 opacity-40">Temporada: Capítulo 5 Temp 4 | Última actualización: <span id="lastUpdate">24/09/2026</span></p>
</header>

<div class="flex justify-center gap-3 mb-6">
  <button onclick="setMode('br')" id="btn-br" class="px-6 py-2 rounded bg-white text-black font-bold">BATTLE ROYALE</button>
  <button onclick="setMode('reload')" id="btn-reload" class="px-6 py-2 rounded card">RECARGA</button>
  <button onclick="setMode('blitz')" id="btn-blitz" class="px-6 py-2 rounded card">BLITZ</button>
</div>

<div class="flex flex-wrap gap-2 mb-4 justify-center text-xs">
  <select id="filterCat" onchange="render()" class="bg-black border border-white/20 rounded px-3 py-1">
    <option value="all">Todas las categorías</option>
    <option value="assault">Rifles de asalto</option><option value="smg">SMG</option><option value="shotgun">Escopetas</option>
    <option value="sniper">Snipers</option><option value="explosive">Explosivos</option><option value="heal">Curaciones</option><option value="mobility">Movilidad</option>
  </select>
  <button onclick="toggleRecOnly()" id="btnRec" class="px-3 py-1 rounded card">⭐ Ver solo recomendados</button>
</div>

<div id="lootGrid" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8"></div>

<div id="compareBar" class="hidden fixed bottom-0 left-0 right-0 bg-black border-t border-cyan-400 p-3 flex justify-between items-center">
  <span id="compareText" class="text-sm"></span>
  <button onclick="showCompare()" class="bg-cyan-400 text-black font-black px-6 py-2 rounded">COMPARAR</button>
</div>

<div id="compareView" class="hidden grid md:grid-cols-2 gap-4">
  <div id="panelA" class="card rounded-xl p-3"></div>
  <div id="panelB" class="card rounded-xl p-3"></div>
</div>

<script>
// === BASE DE DATOS MODULAR - ACÁ CAMBIAS TODO SIN TOCAR HTML ===
const DB = [
  {id:"ar1", nombre:"Rifle A", modo:["br","reload","blitz"], categoria:"assault", rareza:"Legendario", recomendado:{br:true, reload:false, blitz:false}, imagen:"PLACEHOLDER_ar1.png", video:"video_ar1.mp4", stats:{dmg:35, head:70, crit:2, fireRate:5.5, mag:25, reload:2.2, falloff:"20-75m"}},
  {id:"ar2", nombre:"Rifle B", modo:["br","reload"], categoria:"assault", rareza:"Épica", recomendado:{br:false, reload:true, blitz:false}, imagen:"PLACEHOLDER_ar2.png", video:"video_ar2.mp4", stats:{dmg:33, head:66, crit:2, fireRate:5.8, mag:30, reload:2.4, falloff:"20-70m"}},
  {id:"smg1", nombre:"SMG Veloz", modo:["br","reload","blitz"], categoria:"smg", rareza:"Rara", recomendado:{br:true, reload:true, blitz:true}, imagen:"PLACEHOLDER_smg1.png", video:"video_smg1.mp4", stats:{dmg:20, head:40, crit:2, fireRate:9, mag:30, reload:1.8, falloff:"10-40m"}},
  {id:"shot1", nombre:"Escopeta Táctica", modo:["br","blitz"], categoria:"shotgun", rareza:"Legendario", recomendado:{br:true, blitz:false}, imagen:"PLACEHOLDER_shot.png", video:"video_shot.mp4", stats:{dmg:85, head:127, crit:1.5, fireRate:1.2, mag:6, reload:4.5, falloff:"5-15m"}},
  {id:"heal1", nombre:"Med Mist", modo:["br","reload","blitz"], categoria:"heal", rareza:"Rara", recomendado:{br:true, reload:true, blitz:true}, imagen:"PLACEHOLDER_heal.png", video:"", stats:{castTime:"3s", vida:75, escudo:0, movimiento:true, stack:3}},
  {id:"mob1", nombre:"Shockwave", modo:["br","reload"], categoria:"mobility", rareza:"Épica", recomendado:{br:true, reload:false}, imagen:"PLACEHOLDER_mob.png", video:"", stats:{distancia:"15m", cargas:2, cooldown:"2s", caida:true, tags:["Defensivo","Rotación","Escape"]}}
];

let modoActual = "br";
let seleccionados = [];
let recOnly = false;

function setMode(m){modoActual=m; document.querySelectorAll('[id^=btn-]').forEach(b=>b.className="px-6 py-2 rounded card"); document.getElementById('btn-'+m).className="px-6 py-2 rounded bg-white text-black font-bold"; render();}
function toggleRecOnly(){recOnly=!recOnly; document.getElementById('btnRec').classList.toggle('bg-yellow-400'); document.getElementById('btnRec').classList.toggle('text-black'); render();}
function calcDPS(s){ if(!s.dmg ||!s.fireRate) return "N/D"; return (s.dmg * s.fireRate).toFixed(1); }

function render(){
  const cat = document.getElementById('filterCat').value;
  const grid = document.getElementById('lootGrid'); grid.innerHTML="";
  DB.filter(i=> i.modo.includes(modoActual) && (cat==="all" || i.categoria===cat) && (!recOnly || i.recomendado[modoActual])).forEach(item=>{
    const isSel = seleccionados.find(s=>s.id===item.id);
    const isRec = item.recomendado[modoActual];
    grid.innerHTML+=`
    <div class="card rounded-xl p-3 ${isSel?'selected':''}">
      <div class="aspect-[4/3] bg-black/50 rounded flex items-center justify-center text-[10px] opacity-40">TODO: ${item.imagen}</div>
      <h3 class="font-bold mt-2 text-sm">${item.nombre} ${isRec?'⭐':''}</h3>
      <p class="text-xs opacity-50">${item.rareza} • ${item.categoria}</p>
      ${isRec?'<span class="badge-rec text-[10px] px-2 py-0.5 rounded mt-1 inline-block" title="Selección basada en estadísticas, utilidad y rendimiento dentro del meta actual.">⭐ RECOMENDADO DE LA TEMPORADA</span>':''}
      <button onclick="selectItem('${item.id}')" class="w-full mt-2 text-xs py-1.5 rounded ${isSel?'bg-cyan-400 text-black':'bg-white/10'}">${isSel?'SELECCIONADO':'SELECCIONAR'}</button>
    </div>`;
  });
}

function selectItem(id){
  const item = DB.find(i=>i.id===id);
  if(seleccionados.find(s=>s.id===id)){ seleccionados = seleccionados.filter(s=>s.id!==id); }
  else{
    if(seleccionados.length>=2){ alert("Podés comparar solamente 2 objetos a la vez."); return; }
    if(seleccionados.length===1 && seleccionados[0].categoria!==item.categoria){ alert("No permitido: solo podés comparar objetos de la misma categoría (AR vs AR, SMG vs SMG, etc.)"); return; }
    seleccionados.push(item);
  }
  document.getElementById('compareBar').classList.toggle('hidden', seleccionados.length!==2);
  document.getElementById('compareText').innerText = seleccionados.map(s=>s.nombre).join(' vs ');
  render();
}

function showCompare(){
  const view = document.getElementById('compareView'); view.classList.remove('hidden');
  ['A','B'].forEach((p,i)=>{
    const it = seleccionados[i]; if(!it) return;
    document.getElementById('panel'+p).innerHTML=`
      <div class="aspect-video bg-black rounded flex items-center justify-center text-xs">VIDEO: ${it.video || 'N/D'} - cargar solo cuando sea necesario</div>
      <h3 class="font-black mt-2">${it.nombre} ${it.recomendado[modoActual]?'⭐':''}</h3>
      <button onclick="this.nextElementSibling.classList.toggle('hidden')" class="text-xs mt-2 bg-white/10 px-3 py-1 rounded">+ INFO</button>
      <div class="hidden mt-2 text-xs opacity-80 space-y-1 font-mono">
        ${it.categoria!=='heal' && it.categoria!=='mobility'? `
          Daño cuerpo: ${it.stats.dmg?? 'N/D'}<br>Daño cabeza: ${it.stats.head?? 'N/D'}<br>Crítico: ${it.stats.crit?? 'N/D'}x<br>Cadencia: ${it.stats.fireRate?? 'N/D'}<br>DPS: ${calcDPS(it.stats)}<br>Cargador: ${it.stats.mag?? 'N/D'}<br>Recarga: ${it.stats.reload?? 'N/D'}s<br>Fall-off: ${it.stats.falloff?? 'N/D'}<br>Rareza: ${it.rareza}
        `:''}
        ${it.categoria==='heal'?`Cast: ${it.stats.castTime?? 'N/D'}<br>Vida: ${it.stats.vida?? 'N/D'}<br>Escudo: ${it.stats.escudo?? 'N/D'}<br>Movimiento: ${it.stats.movimiento?'Sí':'No'}<br>Stack: ${it.stats.stack?? 'N/D'}`:''}
        ${it.categoria==='mobility'?`Distancia: ${it.stats.distancia?? 'N/D'}<br>Cargas: ${it.stats.cargas?? 'N/D'}<br>Cooldown: ${it.stats.cooldown?? 'N/D'}<br>Anti-caída: ${it.stats.caida?'Sí':'No'}<br>Tags: ${(it.stats.tags||[]).join(', ')||'N/D'}`:''}
      </div>
    `;
  });
  view.scrollIntoView({behavior:'smooth'});
}
render();
</script>
</body>
</html>
